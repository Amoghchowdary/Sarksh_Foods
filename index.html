<!doctype html>
<html lang="en-IN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0c0a" />
    <script>
      // Keep one production origin. This prevents duplicate SEO signals and keeps
      // browser-scoped customer/admin sessions on the same hostname.
      if (location.protocol === "https:" && location.hostname === "sarkshfoods.in") {
        location.replace("https://www.sarkshfoods.in" + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="SARKSH Foods premium red chilli powder (chili powder) in a 1 kg carton for home and business requirements across India." />
    <link rel="icon" type="image/png" href="/sarksh-foods-favicon.png" />
    <link rel="apple-touch-icon" href="/sarksh-foods-favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/assets/logos/sarksh-foods-logo.svg" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/chilli-box-front-v3.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/chilli-box-side.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/chilli-box-top.png" fetchpriority="high" />
    <title>SARKSH Foods | Red Chilli Powder & Premium Chilli Powder India</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
