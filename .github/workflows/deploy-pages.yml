name: Deploy SARKSH Foods to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sarkshfoods-pages-production
  cancel-in-progress: true

env:
  SITE_URL: https://sarkshfoods.in
  BASE_PATH: /
  VITE_API_BASE_URL: https://script.google.com/macros/s/AKfycbw_nR3t5gJfE5BOB4F1NduKDL1Mm10ad73BbnXRygL9pWDm-EwqmcegcVyswZimIYTtgA/exec

jobs:
  build:
    name: Build and validate production site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate production configuration
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
            echo "::error::Repository variable GOOGLE_OAUTH_CLIENT_ID is not configured. Add the Google OAuth 2.0 Web Client ID under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          node scripts/require-site-url.mjs

      - name: TypeScript check
        run: npm run typecheck

      - name: Check production backend health
        run: npm run backend:health

      - name: Build production site for sarkshfoods.in
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: npm run build:prod

      - name: Verify SEO and production artifact
        run: npm run verify:prod

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy production site
    environment:
      name: github-pages
      url: https://sarkshfoods.in
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
